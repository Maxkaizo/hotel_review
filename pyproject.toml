[project]
name = "hotel-review"
version = "0.1.0"
description = "Clasificador didáctico de reseñas con Word2Vec y LSTM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gensim>=4.4,<5",
    "tensorflow[and-cuda]>=2.20,<2.21",
    "numpy>=2.1,<2.3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "jupyterlab>=4.4,<5",
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false
